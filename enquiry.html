<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | The Medalist</title>

    <link rel="stylesheet" href="css_assets/style.css">

</head>

<body>

    <header class="site-header">

        <div class="branding">

            <h1>The Medalist</h1>

            <p>The Human Within the Extraordinary</p>

        </div>

    </header>


    <nav class="site-navigation">

        <a href="index.html">Home</a>
        <a href="sports.html">Sports</a>
        <a href="analysis.html">Analysis</a>
        <a href="features.html">Features</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>

    </nav>


    <main>

        <section class="page-introduction">

            <p class="category">GET IN TOUCH</p>

            <h2>Make an Enquiry</h2>

            <p>
                Have a story, interview opportunity or partnership
                proposal? Contact our editorial team.
            </p>

        </section>


        <section class="enquiry-section">

            <form>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="enquiry-type">
                        Enquiry Type
                    </label>

                    <select
                        id="enquiry-type"
                        name="enquiry-type"
                        required
                    >

                        <option value="">
                            Select an option
                        </option>

                        <option value="story">
                            Story Enquiry
                        </option>

                        <option value="interview">
                            Interview Request
                        </option>

                        <option value="athlete">
                            Athlete / Team Feature
                        </option>

                        <option value="partnership">
                            Partnership / Sponsorship
                        </option>

                        <option value="media">
                            Media Enquiry
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 The Medalist. All rights reserved.
        </p>

    </footer>

</body>

</html>
